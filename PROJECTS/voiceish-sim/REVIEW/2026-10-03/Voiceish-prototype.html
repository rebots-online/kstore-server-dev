const buttons=s=>`<div class="actions">${s.actions.map((a,i)=>`<button ${i===0?'class="primary"':''} data-action="${esc(a[1])}">${esc(a[0])}</button>`).join('')}</div>`;
function forms(id){switch(id){case 'compose':return `<div class="forms"><div><label for="new-number">Recipient phone number</label><input id="new-number" type="tel" placeholder="+1 613 555 0178"></div></div>`;case 'contact-add':return `<div class="forms"><div><label for="contact-name">Contact name</label><input id="contact-name" autocomplete="off" placeholder="Name for this number"></div><div><label for="destination">Save destination</label><select id="destination"><option value="voiceish">Voiceish address book</option><option value="android">Android contacts</option><option value="google">Google Contacts</option><option value="both">Android and Google</option></select></div></div>`;case 'contact-edit':return `<div class="forms"><label for="edit-name">Contact name</label><input id="edit-name" value="${esc(state.contacts.find(c=>c.id==='mara').name)}"><label for="edit-number">Mobile number</label><input id="edit-number" type="tel" value="+1 416 555 0142"></div>`;case 'bulk-review':return `<div class="checkrow"><input id="bulk-1" type="checkbox" checked><label for="bulk-1">Add +1 613 555 0178</label></div><div class="checkrow"><input id="bulk-2" type="checkbox"><label for="bulk-2">Include short code 72401</label></div>`;case 'pair-scan':return `<div class="mockscan">Camera scan placeholder<br><small>No camera permission requested by this draft</small></div>`;case 'sync-settings':return `<div class="forms"><label for="android-policy">Android sync mode</label><select id="android-policy"><option>Two-way</option><option>Read-only</option><option>Import once</option></select><label for="google-policy">Google sync mode</label><select id="google-policy"><option>Two-way</option><option>Read-only</option><option>Import once</option></select></div>`;default:return '';}}
function render(){$('keyboard')?.remove();const s=byId(state.route);const thread=['conversation','unknown'].includes(s.id);const r=state.recipient;const title=thread?r.displayName:s.title;const subtitle=thread?`${r.rawNumber} · Primary SMS SIM`:s.subtitle;$('screenPicker').value=s.id;document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===s.id));$('app').classList.toggle('compact-keyboard',state.keyboard);$('main').innerHTML=`<header class="heading"><div class="identity"><h1>${esc(title)}</h1><p class="muted number">${esc(subtitle)}</p></div><button data-go="${thread?'inbox':'contacts'}">${thread?'Back to messages':'Address book'}</button></header>`+(thread?renderThread(s):`<div class="body"><div class="grid"><section><p class="intro">${esc(s.subtitle)}</p>${s.id==='contacts'?contactList():s.rows.map(row=>`<div class="section">${esc(row)}</div>`).join('')}${forms(s.id)}${buttons(s)}<p class="statusline" id="result" role="status">${esc(state.lastResult||'')}</p></section><aside class="aside"><span class="pill">Review ${screens.indexOf(s)+1} / ${screens.length}</span><h2 style="margin-top:14px">${esc(s.title)}</h2><p>This linked draft describes proposed behavior. Use the screen selector to review error states and the buttons to follow the normal flow.</p><p>No SMS, contact mutation, OAuth grant, or network connection occurs.</p><button data-go="conversation">Inspect recipient layout</button><p class="reviewnote">Figma Design companion available. Figma Make and Stitch export steps remain blocked.</p></aside></div></div>`);showNotice();if(thread){const ta=$('message');ta.value=state.drafts[state.selectedThreadId]||'';ta.oninput=()=>{state.drafts[state.selectedThreadId]=ta.value;$('chars').textContent=ta.value.length+' / 2000';emit();};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendSample();}};$('sendSample').onclick=sendSample;$('keyboardToggle').onclick=()=>{state.keyboard=!state.keyboard;render();};}
if(state.keyboard){const k=document.createElement('div');k.className='keyboard';k.id='keyboard';k.innerHTML='<p>Keyboard height simulation · recipient and composer stay together</p><button id="closeKeyboard">Close keyboard simulation</button>';$('app').append(k);$('closeKeyboard').onclick=()=>{state.keyboard=false;render();};}else $('keyboard')?.remove();if(s.id==='sync-settings'){['android','google'].forEach(source=>$(source+'-policy').onchange=e=>{state.sync[source]=e.target.value;emit();});}}
function contactList(){return `<div class="forms"><label for="contact-search">Search address book</label><input id="contact-search" type="search" placeholder="Name or number"></div><div class="contacts-list" id="contact-results">${state.contacts.map(c=>`<button data-go="${c.id==='mara'?'contact-detail':'number-picker'}"><strong>${esc(c.name)}</strong><small>${esc(c.numbers.join(' · '))}</small><small>${esc(c.sources.join(' + '))}</small></button>`).join('')}</div>`;}
function renderThread(s){const r=state.recipient;return `<div class="thread"><div class="history" id="history"><p class="muted">Sample conversation · no live messages</p>${s.id==='unknown'?'<div class="bubble">Is tomorrow still good?<small>Received · sample</small></div>':'<div class="bubble">I’m at the east entrance.<small>Received · sample</small></div><div class="bubble out">On my way.<small>Accepted by carrier · sample</small></div>'}${state.messages.filter(m=>m.threadId===state.selectedThreadId).map(m=>`<div class="bubble out">${esc(m.body)}<small>Sample send · no SMS transmitted</small></div>`).join('')}<div class="actions">${s.actions.map(a=>`<button data-action="${esc(a[1])}">${esc(a[0])}</button>`).join('')}</div></div><section class="composer" aria-label="Message composer"><div class="recipient"><strong>To: ${esc(r.displayName)}</strong><span class="number" data-bind="recipient.rawNumber">${esc(r.rawNumber)}</span></div><label for="message">Message to ${esc(r.displayName)} · ${esc(r.rawNumber)}</label><div class="composerline"><textarea id="message" rows="2" maxlength="2000" placeholder="Write a sample message…"></textarea><button class="primary" id="sendSample" ${!state.device.online?'disabled':''} aria-label="Send sample to ${esc(r.rawNumber)}">Send</button></div><div class="composerinfo"><span>Primary SMS SIM · ${state.device.online?'sample connected':'phone unavailable'}</span><span id="chars">${(state.drafts[state.selectedThreadId]||'').length} / 2000</span><button id="keyboardToggle">Keyboard test</button><span class="shortcut">Enter sends · Shift+Enter new line</span></div><p class="statusline" role="status" id="result">${esc(state.lastResult||'')}</p></section></div>`;}
function sendSample(){const ta=$('message'),body=ta?.value||'';if(!body.trim()||!state.device.online)return;state.messages.push({id:'sample-send-'+Date.now(),threadId:state.selectedThreadId,recipient:structuredClone(state.recipient),body});state.drafts[state.selectedThreadId]='';state.lastResult='Sample send added. No SMS was transmitted.';render();emit();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-action]');if(b){if(b.dataset.go)navigate(b.dataset.go);else action(b.dataset.action);}});
document.addEventListener('input',e=>{if(e.target.id==='contact-search'){const q=e.target.value.toLowerCase().replace(/[\s()+-]/g,'');document.querySelectorAll('#contact-results button').forEach(b=>b.hidden=!b.textContent.toLowerCase().replace(/[\s()+-]/g,'').includes(q));}});
$('screenPicker').innerHTML=screens.map((s,i)=>`<option value="${s.id}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>`).join('');$('screenPicker').onchange=e=>navigate(e.target.value);$('prev').onclick=()=>navigate(screens[(screens.findIndex(s=>s.id===state.route)+screens.length-1)%screens.length].id);$('next').onclick=()=>navigate(screens[(screens.findIndex(s=>s.id===state.route)+1)%screens.length].id);$('reset').onclick=()=>{state=initial();navigate('welcome');};$('dismissNotification').onclick=()=>{state.notification.event=null;showNotice();emit();};$('openNotification').onclick=()=>{state.notification.event=null;state.customRecipient=false;navigate('conversation');};
// Review-only integration seam. No actual adapter runs in this artifact.
window.voiceishPrototype={schemaVersion,screens:structuredClone(screens),getState:()=>structuredClone(state),navigate,dispatch:action,reset:()=>{state=initial();navigate('welcome');},adapters:Object.freeze({pairing:'PairingAdapter',sms:'SmsAdapter',notifications:'NotificationAdapter',contacts:'ContactRepository',android:'AndroidContactsAdapter',google:'GoogleContactsAdapter',sync:'ContactSyncEngine'})};
const route=location.hash.slice(1);navigate(byId(route)?route:'welcome');
</script></body></html>
