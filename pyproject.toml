[project]
name = "kstore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["qdrant-client", "psycopg[binary]", "httpx", "fastapi", "uvicorn", "numpy", "mcp<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kstore*"]
